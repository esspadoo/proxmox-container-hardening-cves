apiVersion: v1
kind: Pod
metadata:
  name: edge-nginx
spec:
  containers:
    - name: edge-nginx
      image: nginx:1.27-alpine
      command: ["/usr/sbin/nginx"]
      args: ["-g", "daemon off;"]
      ports:
        - containerPort: 80
      securityContext:
        appArmorProfile:
          type: Localhost
          localhostProfile: corp-nginx-web
        seccompProfile:
          type: RuntimeDefault
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: ["NET_BIND_SERVICE", "SETUID", "SETGID", "CHOWN"]
      volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          readOnly: true
        - name: nginx-conf-d
          mountPath: /etc/nginx/conf.d
          readOnly: true
        - name: nginx-html
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-run
          mountPath: /run
        - name: nginx-cache
          mountPath: /var/cache/nginx
  volumes:
    - name: nginx-conf
      hostPath:
        path: /srv/nginx/nginx.conf
        type: File
    - name: nginx-conf-d
      hostPath:
        path: /srv/nginx/conf.d
        type: Directory
    - name: nginx-html
      hostPath:
        path: /srv/nginx/html
        type: Directory
    - name: nginx-run
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
    - name: nginx-cache
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
